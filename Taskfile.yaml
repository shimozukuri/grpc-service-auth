version: "3"

tasks:
  migrate:
    aliases:
      - mig
    desc: "Run database migrations"
    cmds:
      - go run ./cmd/migrator --storage-path=./storage/grpc-service.db --migrations-path=./migrations
  test-migrate:
    aliases:
      - test-mig
    desc: "Run migrations for tests"
    cmds:
      - go run ./cmd/migrator/main.go --storage-path=./storage/grpc-service.db --migrations-path=./tests/migrations --migrations-table=migrations_test